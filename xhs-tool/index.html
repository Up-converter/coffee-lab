<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoffeeLab 冲煮助手</title>
<!-- 小红书小工具版：单文件、资源全内联、零网络请求、零存储依赖（不使用 localStorage/IndexedDB）。
     萃取指导内容与 CoffeeLab 仓库 js/ui/guide.js 同源，改动请两处同步。 -->
<style>
  :root {
    --green: #1E3A2F; --green-mid: #3E6B54; --cream: #F5F3EC; --amber: #C89B3C;
    --brown: #6F4E37; --ink: #26312B; --muted: #7A847D; --card: #FFFFFF; --line: #E4E0D4; --danger: #A3402E;
    --serif: Georgia, 'Songti SC', 'STSong', 'Noto Serif SC', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--cream); color: var(--ink); min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .hero { background: var(--green); color: var(--cream); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .hero h1 { font-family: var(--serif); font-size: 21px; letter-spacing: .5px; }
  .hero p { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.6; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 9px 0; font-size: 14px; cursor: pointer; text-align: center; }
  .tab.on { background: var(--green); color: var(--cream); border-color: var(--green); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 13px; color: var(--green-mid); letter-spacing: 1px; margin-bottom: 12px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--cream); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--amber); border-color: var(--amber); color: #FFF; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row label { font-size: 13px; color: var(--muted); width: 96px; flex-shrink: 0; }
  .row input[type=number] { flex: 1; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 10px; font-size: 16px; background: #FDFCF9; color: var(--ink); width: 100%; }
  .row .unit { font-size: 12px; color: var(--muted); width: 18px; }
  input[type=range] { width: 100%; accent-color: var(--amber); }
  .slider-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .out { display: flex; gap: 10px; margin-top: 4px; }
  .outbox { flex: 1; background: var(--cream); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px; text-align: center; }
  .outbox .k { font-size: 11px; color: var(--muted); }
  .outbox .v { font-family: var(--serif); font-size: 24px; color: var(--green); margin-top: 2px; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 8px; }
  .band { font-size: 12px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--cream);
    border: 1px solid var(--line); color: var(--green-mid); line-height: 1.6; }
  .g-sec h4 { font-size: 13px; color: var(--green-mid); letter-spacing: 1px; margin: 16px 0 10px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .g-sec:first-of-type h4 { margin-top: 0; }
  .g-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .g-item summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.5; user-select: none; }
  .g-item ul { margin: 8px 0 0; padding-left: 18px; }
  .g-item li { font-size: 13px; color: var(--ink); line-height: 1.7; margin: 3px 0; }
  .law { background: #F3EAD3; border: 1px solid #E3D3AA; border-radius: 12px; padding: 12px 14px;
    font-size: 13px; color: #6B5320; line-height: 1.7; margin-bottom: 14px; }
  .foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 20px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>⚗️ CoffeeLab 冲煮助手</h1>
    <p>配比计算 + 萃取问题排查。数据只在你手机上算，不联网、不上传。</p>
  </div>

  <div class="tabs">
    <button class="tab on" id="tab-calc" type="button">🧮 冲煮计算器</button>
    <button class="tab" id="tab-guide" type="button">📖 萃取指导</button>
  </div>

  <div id="page-calc">
    <div class="card">
      <h3>冲煮方式</h3>
      <div class="chips" id="method-chips"></div>
      <div class="row"><label for="in-dose">咖啡粉量</label><input id="in-dose" type="number" inputmode="decimal" step="0.1" min="0" value="15"><span class="unit">g</span></div>
      <div class="row"><label for="in-water" id="water-label">注水总量</label><input id="in-water" type="number" inputmode="decimal" step="1" min="0" value="225"><span class="unit">g</span></div>
      <div class="slider-head"><span>粉水比</span><span id="ratio-label">1 : 15</span></div>
      <input id="ratio" type="range" min="10" max="200" step="1" value="150">
      <div class="out">
        <div class="outbox"><div class="k">比例</div><div class="v" id="out-ratio">1:15</div></div>
        <div class="outbox"><div class="k">浓度感受</div><div class="v" id="out-feel">–</div></div>
      </div>
      <div class="hint" id="method-hint"></div>
    </div>

    <div class="card">
      <h3>萃取率估算（有折光仪再填）</h3>
      <div class="row"><label for="in-bev">咖啡液重</label><input id="in-bev" type="number" inputmode="decimal" step="0.1" min="0" placeholder="如 200"><span class="unit">g</span></div>
      <div class="row"><label for="in-tds">浓度 TDS</label><input id="in-tds" type="number" inputmode="decimal" step="0.01" min="0" placeholder="如 1.35"><span class="unit">%</span></div>
      <div class="out">
        <div class="outbox"><div class="k">萃取率 EY</div><div class="v" id="out-ey">–</div></div>
        <div class="outbox"><div class="k">评价</div><div class="v" id="out-ey-judge" style="font-size:16px">–</div></div>
      </div>
      <div class="band">金杯参考：萃取率 18%~22% 之间风味最均衡。偏低偏尖酸（萃取不足），偏高偏苦涩（萃取过度）。</div>
    </div>
  </div>

  <div id="page-guide" hidden>
    <div class="law">☕ 黄金法则：一次只改一个变量，连测 2~3 杯再下结论。调整顺序建议：先比例（浓淡）→ 再研磨（风味）→ 再水温（性格）→ 最后手法（细节）。</div>
    <div id="guide-list"></div>
  </div>

  <div class="foot">由 CoffeeLab 出品 · 完整版支持记录 / 豆子库 / 对比<br>以上为经验参考，最终以自己的口感为准</div>
</div>

<script src="./main.js"></script>
</body>
</html>
